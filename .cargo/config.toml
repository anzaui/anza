# One shared target dir for every crate in the repo (tools, tools/src/logs,
# engines/rust, examples). Dependencies compile once instead of per crate.
[build]
target-dir = "target"

# Dev builds: keep line tables for our crates, no debuginfo for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Compressors run at max level on every `anza build`. Optimizing them cuts a
# debug-binary build of web/ from ~15 s to ~9 s (release: ~3 s).
[profile.dev.package.brotli]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3
