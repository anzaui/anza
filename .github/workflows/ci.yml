name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  library:
    name: Library (types + browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: library/package-lock.json

      - name: Install
        run: cd library && npm ci

      - name: Type check
        run: cd library && npm run check

      - name: Browser tests
        run: cd library && npm test

      - name: Doc imports
        run: npm run doc:imports

      - name: Types cover runtime exports
        run: npm run types:check

      - name: Package versions agree
        run: npm run versions:check

  rust:
    name: Rust (CLI + engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # One shared target dir for both crates (.cargo/config.toml).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools -> ../target
            engines/rust -> ../../target

      - name: Test CLI
        run: cargo test --manifest-path tools/Cargo.toml

      - name: Test engine
        run: cargo test --manifest-path engines/rust/Cargo.toml --features watch

  typescript:
    name: TypeScript engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build & test
        run: |
          cd engines/ts
          npm ci
          npm test

  python:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          cd engines/py
          python -m unittest discover -s tests -v

  bench:
    name: Load budgets (bundled web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools -> ../target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            library/package-lock.json
            web/package-lock.json

      - name: Build the CLI
        run: cargo build --release --manifest-path tools/Cargo.toml

      - name: Build the docs site
        run: |
          cd web
          npm ci
          ../target/release/anza build

      - name: Install library tooling (puppeteer-core)
        run: cd library && npm ci

      - name: SSG contract
        run: node tasks/ssg-contract-check.js

      # CLEAN/DIST.md §4. ubuntu-latest ships google-chrome (CHROME_PATH wins when set).
      - name: Load budgets (Fast 4G, 5 runs)
        run: npm run bench:load -- --budget --runs 5
