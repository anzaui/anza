name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  library:
    name: Library (types + browser tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: library/package-lock.json

      - name: Install
        run: cd library && npm ci

      - name: Type check
        run: cd library && npm run check

      - name: Browser tests
        run: cd library && npm test

      - name: Doc imports
        run: npm run doc:imports

      - name: Doc links
        run: npm run doc:links

      - name: Types cover runtime exports
        run: npm run types:check

      - name: Package versions agree
        run: npm run versions:check

  rust:
    name: Rust (CLI + engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # One shared target dir for both crates (.cargo/config.toml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            tools -> ../target
            engines/rust -> ../../target

      - name: Test CLI
        run: cargo test --manifest-path tools/Cargo.toml

      - name: Test engine
        run: cargo test --manifest-path engines/rust/Cargo.toml --features watch

  typescript:
    name: TypeScript engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build & test
        run: |
          cd engines/ts
          npm ci
          npm test

  python:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          cd engines/py
          python -m unittest discover -s tests -v

  bench:
    name: Load budgets (bundled web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tools -> ../target

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            library/package-lock.json
            web/package-lock.json

      - name: Build the CLI
        run: cargo build --release --manifest-path tools/Cargo.toml

      - name: Build the docs site
        run: |
          cd web
          npm ci
          ../target/release/anza build

      - name: Install library tooling (puppeteer-core)
        run: cd library && npm ci

      - name: SSG contract
        run: node tasks/ssg-contract-check.js

      - name: Cloudflare worker routing
        run: npm run worker:check

      # CLEAN/DIST.md §4. ubuntu-latest ships google-chrome (CHROME_PATH wins when set).
      - name: Load budgets (Fast 4G, 5 runs)
        run: npm run bench:load -- --budget --runs 5

  supply-chain:
    name: Supply chain (advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Runtime dependencies only: dev tooling (test runner, puppeteer) never ships.
      - name: npm audit (runtime deps)
        run: |
          for dir in library web engines/ts; do
            echo "::group::$dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done

      - name: cargo deny (CLI)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: tools/Cargo.toml
          command: check advisories

      - name: cargo deny (engine)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: engines/rust/Cargo.toml
          command: check advisories
