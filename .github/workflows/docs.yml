name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-docs:
    name: Build & Verify mdBook Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2
        with:
          mdbook-version: '0.5.4'

      - name: Build Rust Engine Documentation
        run: |
          cd engines/rust/docs
          mdbook build

      - name: Build TypeScript Engine Documentation
        run: |
          cd engines/ts/docs
          mdbook build
