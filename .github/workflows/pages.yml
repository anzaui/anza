name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Custom domain on this project site → published at domain root (no /anza base).
  # github.io/anza project URLs need ANZA_BASE_PATH=/anza instead.
  ANZA_SITE_ORIGIN: https://anza.aduki.org

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/target
          key: ${{ runner.os }}-pages-cargo-${{ hashFiles('tools/Cargo.lock') }}

      - name: Build anza CLI
        run: cd tools && cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Structure check
        run: cd web && ../tools/target/release/anza check

      - name: Production build
        run: cd web && ../tools/target/release/anza build

      - name: Prepare Pages artifact
        run: |
          touch web/dist/.nojekyll
          cp web/CNAME web/dist/CNAME

      # Official Pages Actions pattern: package dist/ as the site document root.
      # With a project custom domain the site is at the domain root — leave base empty.
      # Without a custom domain, project sites are at /<repo>/ and need ANZA_BASE_PATH.
      # https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
