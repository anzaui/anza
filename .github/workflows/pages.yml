name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Custom domain on this project site → published at domain root (no /anza base).
  # github.io/anza project URLs need ANZA_BASE_PATH=/anza instead.
  ANZA_SITE_ORIGIN: https://anza.aduki.org

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tools -> ../target

      - name: Build anza CLI
        run: cd tools && cargo build --release

      # web/src/docs is generated from docs/*.md (and docs/_app overlays).
      - name: Generate docs pages
        run: ./target/release/anza docs --pages

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Structure check
        run: cd web && ../target/release/anza check

      - name: Production build
        run: cd web && ../target/release/anza build

      - name: Prepare Pages artifact
        run: |
          touch web/dist/.nojekyll
          cp web/CNAME web/dist/CNAME

      # Official Pages Actions pattern: package dist/ as the site document root.
      # With a project custom domain the site is at the domain root — leave base empty.
      # Without a custom domain, project sites are at /<repo>/ and need ANZA_BASE_PATH.
      # https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
