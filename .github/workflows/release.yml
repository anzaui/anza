name: Release

# Builds the CLI binaries for a `v<version>` tag and attaches them to the
# GitHub release. Normally called by release-please.yml after a release PR is
# merged; a tag pushed by hand still triggers it directly, and it can be run
# manually for an existing tag (Actions -> Release -> Run workflow).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.6.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.6.0
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify version match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Extract tag version
        run: echo "TAG=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Read shared version
        run: echo "VERSION=$(jq -r '.["."]' .release-please-manifest.json)" >> "$GITHUB_ENV"
      - name: Assert match
        run: |
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag version ($TAG) does not match .release-please-manifest.json ($VERSION)"
            exit 1
          fi
          echo "Releasing version $VERSION"
      - name: All package versions agree
        run: node tasks/versions-check.js

  build:
    name: Build ${{ matrix.binary }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: anza-linux-x64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: anza-linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: anza-macos-x64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: anza-macos-arm64
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: anza-windows-x64.exe
            cross: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Release binaries build into tools/target explicitly: `cross` runs in a
      # container that only mounts tools/, so the repo-root .cargo/config.toml
      # target-dir is not visible there.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tools -> target
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Build (native)
        if: '!matrix.cross'
        env:
          CARGO_TARGET_DIR: target
        run: cd tools && cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        env:
          CARGO_TARGET_DIR: target
        run: cd tools && cross build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          SRC="tools/target/${{ matrix.target }}/release/anza${{ endsWith(matrix.binary, '.exe') && '.exe' || '' }}"
          DST="tools/target/${{ matrix.binary }}"
          cp "$SRC" "$DST"

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.binary }}
          path: tools/target/${{ matrix.binary }}
          retention-days: 1

  release:
    name: GitHub Release (Binaries)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: staged-binaries
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x staged-binaries/anza-linux-* staged-binaries/anza-macos-* 2>/dev/null || true

      - name: List staged binaries
        run: ls -la staged-binaries/

      - name: Create or update GitHub release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${RELEASE_TAG#v}
          # release-please already created the release: just attach the binaries.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" staged-binaries/anza-* --clobber
            exit 0
          fi
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk -v ver="## [$VERSION]" '$0 ~ ver {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              NOTES="$SECTION"
            fi
          fi
          ARGS=(gh release create "$RELEASE_TAG" staged-binaries/anza-* --title "anza v$VERSION")
          if [ -n "$NOTES" ]; then
            ARGS+=(--notes "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi
          "${ARGS[@]}"
