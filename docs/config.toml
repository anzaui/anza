# docs/config.toml — manifest for `anza docs`, the docs generator.
# App structure remains anza.json.
#
#   anza docs --pages   docs/*.md → web/src/docs (the site's page folders, [pages])
#   anza docs           docs/*.md → standalone docs site (site.out)
#
# The sidebar is generated from the folder tree: one section per folder, titled
# and ordered by the folder's index.md front matter (`title`, `order`); pages
# by front-matter `order`, then file name. Page front matter: `title`, `order`,
# `seo_title`, `description`.

[site]
title = "Anza Documentation"
base = "/docs"
# Default product out is "dist"; MVP try uses a test folder (override with --out).
out = "tmp/docs-site"

[entry]
home = "index.md"
route = "/docs"
landing = true
shell = "index.html"
root_dock = "main"
via = ["main", "docs", "content"]

[files]
roots = ["."]
include = ["**/*.md"]
exclude = []

[assets]
# Folder roots only — generator copies whole directories into dist (site-root URLs).
# Prefer a future pack = "../tools/assets/docs-site" with styles/, tokens/, views/, images/, docks/.
# Bootstrap from current web/ until that pack exists.
styles = "../web/src/styles"
tokens = "../web/src/tokens"
view_code = "../web/src/views/code"
docks = "../web/src/docks"
# images = "../web/src/images"   # optional; copy whole folder when present
landing = "../web/src/pages/entry"

[seo]
site_name = "Anza"
sitemap = false
robots = false
json_ld = false

[pages]
# Regenerate with `npm run docs`; the deploys run `anza docs --pages` before `anza build`.
out = "../web/src/docs"
# Hand-written page files copied over the generated tree (redirect stubs,
# the ssg.expand fixture, page CSS).
overlay = "_app"
home = "entry"
style = ["/styles/shared.css"]

[[redirect]]
from = "/docs/index"
to = "/docs"
