<dock-docs>
<template shadowrootmode="open">
<style>
:host { contain: layout; display: block; }
:host {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 1200px;
  min-width: 1200px;
}

/* at screen size less than 1200px, make it 100% */
@media (max-width: 1200px) {
  :host {
    max-width: 100%;
    min-width: 100%;
    padding: 0 20px;
  }
}

/* ─── Shell ───────────────────────────────────────── */
.docs-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--background);
  border-bottom: 1px solid color-mix(in oklch, var(--text-color) 10%, transparent);
  font-family: var(--font-ui);
  /* transition: background 280ms var(--ease-out), border-color 280ms; */
}
html[data-theme="dark"] .docs-header {
  border-bottom-color: var(--border);
}

.header-inner {
  width: 100%;
  margin: 0;
  padding: 0;
  height: 54px;
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

/* ─── Logo ────────────────────────────────────────── */
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
  flex-shrink: 0;
}

.logo-mark {
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: var(--accent-color);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 280ms;
}

.version {
  font-size: 11px;
  font-weight: 500;
  color: var(--accent-color);
  background: color-mix(in oklch, var(--accent-color) 12%, transparent);
  padding: 2px 7px;
  border-radius: 999px;
  letter-spacing: 0.01em;
  line-height: 1.6;
}

/* ─── Nav ─────────────────────────────────────────── */
.header-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: 0.75rem;
  flex: 1;
}

.nav-link {
  font-size: 13px;
  font-weight: 500;
  color: var(--nav-color);
  text-decoration: none;
  padding: 5px 10px;
  border-radius: 6px;
  transition: color 120ms var(--ease-out), background 120ms;
}
.nav-link:hover {
  color: var(--title-color);
  background: color-mix(in oklch, var(--text-color) 7%, transparent);
}
.nav-link.active {
  color: var(--accent-color);
  background: color-mix(in oklch, var(--accent-color) 9%, transparent);
}
.nav-link--gh {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
  color: var(--label-color);
}

/* ─── Actions ─────────────────────────────────────── */
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* ─── Orbital theme toggle ────────────────────────── */
.theme-toggle {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  display: flex;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
}

.orbital {
  width: 42px;
  height: 26px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid color-mix(in oklch, var(--text-color) 14%, transparent);
  position: relative;
  transition: background 300ms var(--ease-in-out), border-color 300ms;
  overflow: visible;
}
.orbital.dark {
  background: color-mix(in oklch, var(--accent-color) 10%, transparent);
  border-color: color-mix(in oklch, var(--accent-color) 22%, transparent);
}

/* Dots that appear in dark mode */
.orbital::before {
  content: '·  ·';
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--accent-color);
  opacity: 0;
  transition: opacity 240ms;
  pointer-events: none;
  line-height: 1;
}
.orbital.dark::before {
  opacity: 0.55;
}

.orbital-knob {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--background);
  border: 1px solid color-mix(in oklch, var(--text-color) 12%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 300ms var(--ease-in-out), background 300ms, border-color 300ms;
  transform: translateX(0);
}
.orbital.dark .orbital-knob {
  transform: translateX(16px);
  border-color: color-mix(in oklch, var(--accent-color) 40%, transparent);
}

.icon-sun { color: var(--accent-color); }
.icon-moon { color: var(--accent-color); display: none; }
.orbital.dark .icon-sun  { display: none; }
.orbital.dark .icon-moon { display: block; }

/* ─── Mobile hamburger button ─────────────────────── */
.mobile-menu-btn {
  display: none;
  width: 30px;
  height: 30px;
  background: none;
  border: 1px solid color-mix(in oklch, var(--text-color) 14%, transparent);
  border-radius: 8px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: background 120ms, border-color 120ms;
}
.mobile-menu-btn:hover {
  background: color-mix(in oklch, var(--text-color) 6%, transparent);
}

.hamburger {
  width: 16px;
  height: 8px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hamburger span {
  display: block;
  width: 100%;
  height: 2px;
  border-radius: 1px;
  background: var(--text-color);
  transition: transform 200ms var(--ease-in-out), opacity 150ms;
  transform-origin: center;
}

button.mobile-menu-btn[aria-expanded="true"] .hamburger span:nth-child(1) {
  transform: translateY(3px) rotate(45deg);
}
button.mobile-menu-btn[aria-expanded="true"] .hamburger span:nth-child(2) {
  transform: translateY(-3px) rotate(-45deg);
}

/* ─── Sidebar backdrop ────────────────────────────── */
.sidebar-backdrop {
  display: none;
}

/* ─── Responsive ──────────────────────────────────── */
@media (max-width: 600px) {
  .header-nav { display: none; }

  .header-inner {
    width: 100%;
    margin: 0;
    padding: 0;
    height: 54px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.2rem;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 15px;
    flex-shrink: 0;
  }

  .mobile-menu-btn { display: flex; }

  /* ─── Mobile sidebar drawer ─────────────────────── */
  div.docs-container {
    grid-template-columns: 1fr;
  }

  aside.docs-sidebar-left {
    position: fixed;
    top: 54px;
    left: 0;
    width: 100%;
    height: calc(100vh - 54px);
    background: var(--background);
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 280ms var(--ease-in-out);
    padding: 16px 20px;
    box-sizing: border-box;
    overflow-y: auto;
    border-right: none;
  }

  aside.docs-sidebar-left.open {
    transform: translateX(0);
  }

  .sidebar-backdrop {
    display: block;
    position: fixed;
    inset: 54px 0 0 0;
    background: rgba(0, 0, 0, 0.35);
    z-index: 199;
    opacity: 0;
    visibility: hidden;
    transition: opacity 200ms var(--ease-out), visibility 200ms;
  }

  .sidebar-backdrop.visible {
    opacity: 1;
    visibility: visible;
  }

  aside.docs-sidebar-right {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .orbital, .orbital-knob, .hamburger span,
  .docs-sidebar-left, .sidebar-backdrop, .nav-link, .docs-header { transition: none !important; }
}

/* ─── Container ───────────────────────────────────── */
div.docs-container {
  display: grid;
  grid-template-columns: 200px 1fr 250px;
  column-gap: 20px;
  row-gap: 20px;
  height: calc(100vh - 54px);
  overflow: hidden;
  margin-top: 12px;
}

/* at 1200px width, make the left sidebar 150px */
@media (max-width: 1200px) {
  div.docs-container {
    grid-template-columns: 160px 1fr 230px;
    row-gap: 16px;
    column-gap: 16px;
    margin-top: 10px;
  }
}


/* ─── Sidebar Left ─────────────────────────────────── */
aside.docs-sidebar-left {
  overflow-y: auto;
  scrollbar-width: none;
  scrollbar-color: var(--border) transparent;
}

aside.docs-sidebar-left::-webkit-scrollbar {
  width: none;
  display: none;
}

aside.docs-sidebar-left::-webkit-scrollbar-track {
  background: transparent;
}

aside.docs-sidebar-left::-webkit-scrollbar-thumb {
  background-color: var(--border);
  border-radius: 3px;
  transition: background 120ms var(--ease-out);
}

aside.docs-sidebar-left::-webkit-scrollbar-thumb:hover {
  background-color: var(--accent-color);
}

/* ─── Sidebar Right ────────────────────────────────── */
aside.docs-sidebar-right {
  overflow-y: auto;
  scrollbar-width: none;
  scrollbar-color: var(--border) transparent;
}

aside.docs-sidebar-right::-webkit-scrollbar {
  width: none;
  display: none;
}

aside.docs-sidebar-right::-webkit-scrollbar-track {
  background: transparent;
}

aside.docs-sidebar-right::-webkit-scrollbar-thumb {
  background-color: none;
  border-radius: none;
}

/* ─── Kill the browser's default marker ──────────── */
.sidebar-group summary {
  list-style: none;
}
.sidebar-group summary::-webkit-details-marker {
  display: none;
}

/* ─── Header is now a summary ─────────────────────── */
.sidebar-group-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  transition: background 120ms var(--ease-out);
}

.sidebar-group-header:hover {
  background: color-mix(in oklch, var(--text-color) 6%, transparent);
}

.sidebar-group-header h3 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-color);
  flex: 1;
  margin: 0;
}

/* ─── Chevron via [open] attribute ────────────────── */
.group-chevron {
  width: 14px;
  height: 14px;
  color: color-mix(in oklch, var(--text-color) 35%, transparent);
  flex-shrink: 0;
  transition: transform 240ms var(--ease-in-out), color 120ms;
}

details[open] .group-chevron {
  transform: rotate(90deg);
  color: var(--accent-color);
}

/* ─── Links wrapper — no grid trick needed anymore ── */
.sidebar-group-links {
  padding-bottom: 4px;
}

/* ─── Links (unchanged) ───────────────────────────── */
.sidebar-group a {
  display: block;
  font-size: 13px;
  font-weight: 400;
  color: var(--nav-color);
  text-decoration: none;
  padding: 5px 8px 5px 18px;
  border-radius: 6px;
  position: relative;
  transition: color 120ms var(--ease-out), background 120ms;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-group a:hover {
  color: var(--title-color);
  background: color-mix(in oklch, var(--text-color) 6%, transparent);
}

.sidebar-group a.active {
  color: var(--accent-color);
  background: color-mix(in oklch, var(--accent-color) 9%, transparent);
  font-weight: 500;
}

.sidebar-group a.active::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--accent-color);
}

@media (prefers-reduced-motion: reduce) {
  .group-chevron { transition: none; }
}

/* ─── Reduced motion ──────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  aside.docs-sidebar-left .sidebar-group-links,
  .group-chevron { transition: none; }
}

main.docs-content {
  margin: 0;
  padding: 0 10px 50px;
  overflow-y: auto;
  scroll-behavior: smooth;
  scrollbar-width: none;
}

main.docs-content::-webkit-scrollbar {
  visibility: hidden;
  display: none;
}

/* ─── Shell ───────────────────────────────────────── */
.docs-sidebar-right {
  padding: 0 0 24px 10px;
  overflow-y: auto;
  scrollbar-width: none;
  font-family: var(--font-ui);
}

.docs-sidebar-right::-webkit-scrollbar {
  display: none;
}

/* ─── Sticky inner ────────────────────────────────── */
.toc-inner {
  position: sticky;
  top: 72px;
}

/* ─── Heading ─────────────────────────────────────── */
.docs-sidebar-right h4 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-color);
  margin: 0 0 10px 0;
  padding: 0 8px;
}

/* ─── List ────────────────────────────────────────── */
.toc-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.toc-list li {
  margin: 0;
}

/* ─── Links — h2 ──────────────────────────────────── */
.toc-list a {
  display: block;
  font-size: 12.5px;
  font-weight: 400;
  line-height: var(--leading-normal);
  color: var(--nav-color);
  text-decoration: none;
  text-overflow: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  padding: 3px 8px;
  border-radius: 5px;
  transition:
    color var(--duration-fast) var(--ease-out),
    background var(--duration-fast) var(--ease-out);
}

.toc-list a:hover {
  color: var(--title-color);
  background: color-mix(in oklch, var(--text-color) 6%, transparent);
}

.toc-list a.active {
  color: var(--accent-color);
  font-weight: 500;
  background: color-mix(in oklch, var(--accent-color) 8%, transparent);
}

/* ─── h3 — your JS sets padding-left and font-size inline,
       these rules only handle color so they won't conflict ── */
.toc-list a[style*="padding-left"] {
  color: color-mix(in oklch, var(--nav-color) 75%, transparent);
  font-size: 12px;
}

.toc-list a[style*="padding-left"]:hover {
  color: var(--title-color);
  background: color-mix(in oklch, var(--text-color) 6%, transparent);
}

.toc-list a[style*="padding-left"].active {
  color: var(--accent-color);
  font-weight: 500;
  background: color-mix(in oklch, var(--accent-color) 8%, transparent);
}

/* ─── Reduced motion ──────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .toc-list a { transition: none; }
}

/* ─── Mobile ───────────────────────────────────────── */
@media (max-width: 1000px) {
  div.docs-container {
    grid-template-columns: 160px 1fr;
    row-gap: 16px;
    column-gap: 16px;
    margin-top: 10px;
  }

  .docs-sidebar-right {
    display: none;
    visibility: hidden;
  }
}


/* ─── Mobile ───────────────────────────────────────── */
@media (max-width: 800px) {
  :host {
    max-width: 100% !important;
    min-width: 100% !important;
    padding: 0 10px !important;
  }

  div.docs-container {
    grid-template-columns: 150px 1fr;
    row-gap: 16px;
    column-gap: 16px;
    margin-top: 10px;
  }

  .docs-sidebar-right {
    display: none;
    visibility: hidden;
  }
}

/* ─── Mobile ───────────────────────────────────────── */
@media (max-width: 600px) {
  :host {
    max-width: 100% !important;
    min-width: 100% !important;
    padding: 0 10px !important;
  }

  div.docs-container {
    display: flex;
    flex-flow: column;
    row-gap: 16px;
    column-gap: 16px;
    margin-top: 10px;
  }

  .docs-sidebar-right {
    display: none;
    visibility: hidden;
  }

  main.docs-content {
    margin: 0;
    padding: 0 0 50px;
    overflow-y: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -ms-overflow-style: none; /* IE and Edge */
  }

  /* Hide scrollbar for Chrome, Safari and Opera */
  main.docs-content::-webkit-scrollbar {
    display: none;
  }
}

<template shadowrootmode="open">
<style>
@charset "UTF-8";

/* ═══════════════════════════════════════════════════
   DOCS SHARED — base reset + content styles
   Tokens: light.css / dark.css / typography.css /
           motion.css / spacing.css / table.css
   ═══════════════════════════════════════════════════ */


/* ─── Box model + inheritance ─────────────────────── */

*,
*::before,
*::after {
  box-sizing: border-box;
  font-family: inherit;
  font-size: inherit;
  font-weight: inherit;
  color: var(--text-color);
}

*:focus {
  outline: inherit !important;
}

::selection {
  background-color: var(--tab-background);
}


/* ─── Scrollbar ───────────────────────────────────── */

* {
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar, var(--gray-color)) transparent;
}

*::-webkit-scrollbar {
  width: 3px;
  height: 3px;
}

*::-webkit-scrollbar-track {
  background: transparent;
}

*::-webkit-scrollbar-thumb {
  background: var(--scrollbar, var(--gray-color));
  border-radius: 50px;
}


/* ═══════════════════════════════════════════════════
   TYPOGRAPHY
   ═══════════════════════════════════════════════════ */

/* ─── Headings — untouched structure, refined tokens ─ */

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading, var(--font-sans));
  font-weight: 600;
  color: var(--title-color);
  line-height: var(--leading-tight);
  margin: 10px 0;
}

h1 { font-size: var(--text-xl); font-weight: 700; margin: 0 0 10px; }
h2 { font-size: var(--text-lg);   margin: 30px 0 10px; }
h3 { font-size: var(--text-md);   margin: 20px 0 10px; }
h4 { font-size: var(--text-sm); }
h5 { font-size: var(--text-sm); }
h6 { font-size: var(--text-xs); }

@media (max-width: 700px) {
  h1, h2, h3, h4, h5, h6 { margin: 5px 0; }
}


/* ─── Body copy ───────────────────────────────────── */

p {
  margin: 5px 0;
  font-family: var(--font-body, var(--font-sans));
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  color: var(--text-color);
}

figcaption p {
  font-size: var(--text-sm) !important;
}


/* ─── Links ───────────────────────────────────────── */

a {
  font-weight: var(--weight-medium);
  color: var(--anchor-color);
  text-decoration: none;
  transition: color var(--duration-fast) var(--ease-out),
              text-decoration-color var(--duration-fast) var(--ease-out);
}

a:hover,
a:focus {
  text-decoration: underline;
  text-underline-offset: 3px;
}


/* ─── Inline text ─────────────────────────────────── */

b, strong { font-weight: var(--weight-semibold); }

small { font-size: 80%; }

abbr[title] {
  border-bottom: none;
  text-decoration: underline dotted;
}

sub, sup {
  font-size: 75%;
  line-height: 0;
  position: relative;
  vertical-align: baseline;
}
sub { bottom: -0.25em; }
sup { top: -0.5em; }


/* ─── Blockquote ──────────────────────────────────── */

blockquote {
  margin: 24px 0;
  padding: 16px 24px;
  border-left: 3px solid var(--border, var(--surface));
  background-color: var(--surfaceSunken, var(--surface));
  border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
  color: var(--nav-color);
  font-style: italic;
}

blockquote p {
  margin: 0;
  line-height: var(--leading-relaxed);
}

blockquote p + p {
  margin-top: 12px;
}

blockquote cite {
  display: block;
  margin-top: 10px;
  font-size: var(--text-sm);
  color: var(--nav-color);
  font-style: normal;
  opacity: 0.75;
}

blockquote cite::before {
  content: "— ";
}


/* ═══════════════════════════════════════════════════
   CODE
   ═══════════════════════════════════════════════════ */

/* ─── Inline code ─────────────────────────────────── */

code {
  font-family: var(--font-mono);
  font-size: 0.875em;
  background-color: var(--prism-background);
  color: var(--prism-text);
  padding: 0.15em 0.45em;
  border-radius: var(--radius-md);
  transition: background-color var(--duration-normal) var(--ease-out),
              color var(--duration-normal) var(--ease-out);
}


/* ─── Code block ──────────────────────────────────── */

pre {
  background-color: var(--surfaceElevated, var(--surface)) !important;
  border: 1px solid var(--border, var(--surface));
  border-radius: var(--radius-lg);
  padding: 32px 24px 24px;
  overflow-x: auto;
  overflow-y: hidden;
  position: relative;
  transition: background-color var(--duration-normal) var(--ease-out),
              border-color var(--duration-normal) var(--ease-out);
  scrollbar-width: thin;
  scrollbar-color: var(--border, var(--surface)) transparent;
}

pre::-webkit-scrollbar        { height: 4px; }
pre::-webkit-scrollbar-track  { background: transparent; }
pre::-webkit-scrollbar-thumb  {
  background-color: var(--border, var(--surface));
  border-radius: var(--radius-sm);
}
pre::-webkit-scrollbar-thumb:hover {
  background-color: var(--nav-color);
}

pre code {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  background: none;
  color: inherit;
  padding: 0;
  border-radius: 0;
}


/* ─── Kbd ─────────────────────────────────────────── */

kbd {
  font-family: var(--font-ui);
  font-size: 0.75em;
  background: color-mix(in oklch, var(--text-color) 8%, transparent);
  border: 1px solid color-mix(in oklch, var(--text-color) 16%, transparent);
  border-radius: var(--radius-sm);
  padding: 2px 6px;
  color: var(--label-color);
  line-height: 1.6;
}


/* ═══════════════════════════════════════════════════
   LISTS
   ═══════════════════════════════════════════════════ */

/* ─── Unordered ───────────────────────────────────── */

ul {
  list-style: none;
  padding-left: 0;
  margin: 24px 0;
  font-family: var(--font-body, var(--font-sans));
}

ul li {
  position: relative;
  padding-left: 1.5rem;
  margin: 8px 0;
  font-size: var(--text-base);
  color: var(--text-color);
  line-height: var(--leading-relaxed);
}

/* Level 1 — filled dot, accent */
ul li::before {
  content: '';
  position: absolute;
  left: calc(0.5rem + 2px);
  top: 0.65em;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background-color: var(--accent-color);
}

/* Level 2 — hollow ring */
ul ul { margin: 8px 0; }

ul ul li::before {
  width: 4px;
  height: 4px;
  background-color: transparent;
  border: 1.5px solid var(--accent-color);
  top: 0.68em;
}

/* Level 3 — small square, muted */
ul ul ul li::before {
  border-radius: var(--radius-sm);
  border: none;
  background-color: var(--nav-color);
}


/* ─── Ordered ─────────────────────────────────────── */

ol {
  list-style: none;
  padding-left: 0;
  margin: 24px 0;
  font-family: var(--font-body, var(--font-sans));
  counter-reset: docs-ol;
}

ol li {
  position: relative;
  padding-left: 2rem;
  margin: 8px 0;
  font-size: var(--text-base);
  color: var(--text-color);
  line-height: var(--leading-relaxed);
  counter-increment: docs-ol;
}

ol li::before {
  content: counter(docs-ol);
  position: absolute;
  left: 0;
  top: 0.05em;
  width: 1.5rem;
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  font-family: var(--font-ui);
  color: var(--accent-color);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* Level 2 — alpha, muted */
ol ol {
  margin: 8px 0;
  counter-reset: docs-ol-alpha;
}

ol ol li { counter-increment: docs-ol-alpha; }

<!-- Main Content -->
<h1>Start</h1>
<p>Create a new Anza app and run it.</p>

<!-- Scaffold Section -->
<h2>Scaffold</h2>
<view-code language="bash">
  npm create @adukiorg/anza myapp
  cd myapp
  npm install
</view-code>
<p>This generates:</p>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Path</th>
        <th>Purpose</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><code>src/app.js</code></td>
        <td>Entry point — imports the UI system and defines a layout dock</td>
      </tr>
      <tr>
        <td><code>src/index.html</code></td>
        <td>HTML shell with importmap, tokens, styles, and module script</td>
      </tr>
      <tr>
        <td><code>src/sw.js</code></td>
        <td>Service Worker entry — caching, routing, sync</td>
      </tr>
      <tr>
        <td><code>src/pages/entry/index.js</code></td>
        <td>Landing page definition</td>
      </tr>
      <tr>
        <td><code>src/pages/entry/index.html</code></td>
        <td>Landing page markup</td>
      </tr>
      <tr>
        <td><code>src/pages/entry/index.css</code></td>
        <td>Landing page styles</td>
      </tr>
      <tr>
        <td><code>src/tokens/</code></td>
        <td>Design tokens copied from the library (colors, spacing, typography)</td>
      </tr>
      <tr>
        <td><code>src/styles/</code></td>
        <td>Global styles copied from the library (reset, layers, base)</td>
      </tr>
      <tr>
        <td><code>importmap.json</code></td>
        <td>Empty starter for custom aliases</td>
      </tr>
      <tr>
        <td><code>package.json</code></td>
        <td>Scripts: <code>dev</code> and <code>build</code></td>
      </tr>
    </tbody>
  </table>
</div>
<p>
  You own <code>src/tokens/</code> and <code>src/styles/</code>. The library copies them in as starter files; change
  them freely.
</p>

<!-- Run Section -->
<h2>Run</h2>
<view-code language="bash">
  npm run dev
</view-code>
<p>Opens a dev server on <code>http://localhost:3000</code> with:</p>
<ul>
  <li>Import graph resolution into <code>dist/</code></li>
  <li>Separate <code>dist/importmap.json</code> linked from HTML</li>
  <li>CSS hot-swapping via SSE</li>
  <li>JS and HTML auto-reload on change</li>
</ul>

<!-- Generated Files Section -->
<h2>What Was Generated</h2>

<!-- App.js File -->
<h3><code>src/app.js</code></h3>
<view-code language="javascript">
  import '@adukiorg/anza/ui';
  import { dock } from '@adukiorg/anza/ui';

  // Register the Service Worker
  navigator.serviceWorker.register('/sw.js');

  // Layout shell
  dock('main');

  import './pages/index.js';
</view-code>
<p>
  This initializes the UI system, registers the Service Worker, creates a <code>main</code> dock, and loads the welcome
  page.
</p>

<!-- Entry Page File -->
<h3><code>src/pages/entry/index.js</code></h3>
<view-code language="javascript">
  import { page } from '@adukiorg/anza/ui';

  page('/', {
    tag: 'page-welcome',
    via: ['main'],
    template: { html: './index.html', css: './index.css' }
  }, import.meta.url);
</view-code>
<p>
  Defines a route at <code>/</code> that renders through the <code>main</code> dock, loading its markup and styles from
  sibling files.
</p>

<!-- Customization Section -->
<h3>Customizing the landing page</h3>
<p>
  The <code>src/pages/entry/</code> folder is the scaffold default. You can rename it, delete it, or replace it with
  any folder or files you want. The only requirement is that <code>src/pages/index.js</code> imports whatever defines
  your <code>/</code> route.
</p>
<view-code language="javascript">
  // src/pages/index.js
  import './entry/index.js'; // default — can rename
  import './home/index.js'; // or call it home
  import './landing/index.js'; // or landing
</view-code>
<p>You can also define the route inline without a separate folder:</p>
<view-code language="javascript">
  // src/pages/index.js
  import { page } from '@adukiorg/anza/ui';

  page('/', {
    tag: 'page-home',
    via: ['main'],
    template: '&lt;h1&gt;Home&lt;/h1&gt;'
  });
</view-code>

  });
</view-code>
<p>
  Clicking <code>&lt;a href="/about"&gt;</code> is intercepted, matched, and swapped inside <code>main</code> without a
  reload.
</p>
