[package]
# Crate is anza-cli (the engine crate in engines/rust is `anza`); the
# installed binary is still `anza`.
name = "anza-cli"
version = "0.6.0"
edition = "2021"

[lib]
name = "anza_cli"
path = "src/lib.rs"

[[bin]]
name = "anza"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.6.11", features = ["fs", "set-status"] }
notify = "8.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
walkdir = "2.5.0"
swc_common = { version = "23.0.1", features = ["concurrent"] }
swc_ecma_parser = "41.0.0"
swc_ecma_ast = "25.0.0"
swc_ecma_visit = "25.0.0"
anza_logs = { package = "anza-logs", path = "src/logs" }
scraper = "0.27.0"
rayon = "1.12.0"
toml = "0.8"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ahash = "0.8"
memchr = "2.7"
aho-corasick = "1.1"
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["bundler"] }
brotli = "=9.0.0"
flate2 = "=1.1.10"

